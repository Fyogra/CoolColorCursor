name: release

# exe собирается здесь, из кода тега релиза (или указанного коммита), а не на чьём-то компьютере: любой может сверить исходники и сборку
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Тег релиза, к которому приложить exe (например v.2.0.7)"
        required: true
      ref:
        description: "Коммит для пересборки без нового релиза (пусто — код тега)"
        required: false

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || env.TAG }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install PyQt5==5.15.11 pyinstaller==6.22.3   # версии те же, что у локальной сборки
      - run: pyinstaller --noconfirm CCC.spec
      - name: Upload exe
        shell: bash
        run: |
          src="тега $TAG"
          [ -z "${{ inputs.ref }}" ] || src="коммита $(git rev-parse HEAD)"
          sha=$(sha256sum dist/CCC.exe | cut -d' ' -f1)
          echo "$sha  CCC.exe" > dist/CCC.exe.sha256
          gh release upload "$TAG" dist/CCC.exe dist/CCC.exe.sha256 --clobber
          body=$(gh release view "$TAG" --json body -q .body | sed '/^Собрано GitHub Actions/,$d')
          gh release edit "$TAG" --notes "$body

          Собрано GitHub Actions из исходников $src: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID
          SHA-256 CCC.exe: \`$sha\`"
