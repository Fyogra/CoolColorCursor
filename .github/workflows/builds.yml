name: builds

on:
  schedule:
    - cron: "17 3 * * *"   # раз в сутки
  workflow_dispatch:

permissions:
  contents: write

jobs:
  export:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install PyQt5
      - run: python tools/export_builds.py
        env:
          STRATZ_TOKEN: ${{ secrets.STRATZ_TOKEN }}
      - name: Commit data
        shell: bash
        run: |
          git config user.name "builds-bot"
          git config user.email "builds-bot@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "Обновление сборок"
          git push
